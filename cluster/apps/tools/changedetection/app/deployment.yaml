---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-sockpuppet
  namespace: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browser-sockpuppet
  template:
    metadata:
      labels:
        app: browser-sockpuppet
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.homelab/cpu-tier
                    operator: In
                    values:
                      - high
      containers:
        - name: browser
          # renovate: depName=dgtlmoon/sockpuppetbrowser datasource=docker
          image: dgtlmoon/sockpuppetbrowser:0.0.3@sha256:23a7be698216407648b6c78fc55de0411bde550635edc30347373c86a5176fad
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: false
          env:
            - name: SCREEN_WIDTH
              value: "1920"
            - name: SCREEN_HEIGHT
              value: "1080"
            - name: SCREEN_DEPTH
              value: "16"
            - name: MAX_CONCURRENT_CHROME_PROCESSES
              value: "3"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: home-chrome
              mountPath: /home/chrome
          # sockpuppetbrowser pierde la cuenta de sus Chrome y deja sesiones
          # huerfanas vivas durante semanas; con la memoria agotada los Chrome
          # nuevos no arrancan en 20s y el websocket se cierra con code=1000.
          # El puerto 3000 sigue abierto, asi que un tcpSocket no lo detecta:
          # se reinicia si algun chromium lleva vivo mas de 1h.
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import os, sys
                  hz = os.sysconf("SC_CLK_TCK")
                  up = float(open("/proc/uptime").read().split()[0])
                  for pid in filter(str.isdigit, os.listdir("/proc")):
                      try:
                          s = open(f"/proc/{pid}/stat").read()
                      except OSError:
                          continue
                      comm = s[s.index("(") + 1:s.rindex(")")]
                      start = int(s[s.rindex(")") + 2:].split()[19]) / hz
                      if comm == "chromium" and up - start > 3600:
                          sys.exit(1)
            initialDelaySeconds: 60
            periodSeconds: 300
            timeoutSeconds: 10
            failureThreshold: 1
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        # Chrome arranca con --disable-dev-shm-usage, asi que escribe en /tmp
        # y no en /dev/shm: las capturas de pantalla llenaban el tmpfs pequeno
        # y fallaban con "Unable to capture screenshot".
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: home-chrome
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: browser-sockpuppet
  namespace: tools
spec:
  selector:
    app: browser-sockpuppet
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sockpuppetbrowser-netpol
  namespace: tools
spec:
  podSelector:
    matchLabels:
      app: browser-sockpuppet
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: changedetection
      ports:
        - port: 3000
  egress:
    - {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
  namespace: tools
spec:
  replicas: 1
  strategy:
    # El PVC es RWO: con RollingUpdate el pod nuevo espera un volumen que el
    # viejo todavia tiene montado y el rollout se bloquea.
    type: Recreate
  selector:
    matchLabels:
      app: changedetection
  template:
    metadata:
      labels:
        app: changedetection
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.homelab/cpu-tier
                    operator: In
                    values:
                      - high
      containers:
        - name: changedetection
          # renovate: depName=ghcr.io/dgtlmoon/changedetection.io datasource=docker
          image: ghcr.io/dgtlmoon/changedetection.io:0.60.10@sha256:72f97681f390e4d6ae3e6585e1e0036449910f347144b766fc23910458566a1a
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PLAYWRIGHT_DRIVER_URL
              value: "ws://browser-sockpuppet:3000/?stealth=1&headful=true&--window-size=1920,1080"
            # Debe coincidir con MAX_CONCURRENT_CHROME_PROCESSES del navegador:
            # si hay mas workers que procesos Chrome, los sobrantes agotan el
            # timeout de 60s de connect_over_cdp y el watch falla.
            # Fijarlo aqui anula el campo equivalente de la UI sin avisar.
            - name: FETCH_WORKERS
              value: "3"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /datastore
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: changedetection-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: changedetection
  namespace: tools
  annotations:
    metallb.universe.tf/address-pool: "${METALLB_POOL_HOME}"
    metallb.universe.tf/loadBalancerIPs: "${CHANGEDETECTION_LB_IP}"
spec:
  type: LoadBalancer
  selector:
    app: changedetection
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: changedetection-netpol
  namespace: tools
spec:
  podSelector:
    matchLabels:
      app: changedetection
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 5000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: browser-sockpuppet
      ports:
        - port: 3000
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 80
        - port: 443
